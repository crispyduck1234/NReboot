<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NickReboot — Retro TV</title>

<style>
:root {
  --orange: #ff6500;
  --bg: #101010;
  --panel: #1b1b1b;
  --muted: #aaa;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: white;
  font-family: "Trebuchet MS", Arial, sans-serif;
}

header {
  padding: 22px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #303030;
}

.logo {
  font-weight: 1000;
  font-size: 30px;
  font-style: italic;
  letter-spacing: -2px;
  color: var(--orange);
}

.live {
  color: #ff5555;
  font-size: 12px;
  letter-spacing: 2px;
}

main {
  width: min(1000px, 92%);
  margin: 38px auto;
}

h1 {
  font-size: clamp(26px, 5vw, 44px);
  margin-bottom: 8px;
}

.subtitle {
  color: var(--muted);
  margin-top: 0;
}

.tv {
  padding: 10px;
  border: 2px solid #383838;
  border-radius: 14px;
  background: #222;
  box-shadow: 0 14px 55px #0009;
}

.screen {
  position: relative;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  background: #050505;
  border-radius: 7px;
}

video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.scanlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    #0001 2px,
    #0005 3px,
    transparent 4px
  );
}

#screenMessage {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  padding: 20px;
  pointer-events: none;
}

#screenMessage strong {
  color: var(--orange);
  font-size: clamp(25px, 6vw, 58px);
  font-weight: 1000;
  font-style: italic;
}

#screenMessage span {
  color: #ddd;
  margin-top: 12px;
  font-size: 12px;
  letter-spacing: 3px;
}

#screenMessage.hidden {
  display: none;
}

.info {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: space-between;
  padding: 20px 4px;
}

.info p { margin: 6px 0; }

.muted {
  color: var(--muted);
  font-size: 13px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 10px 0 30px;
}

button {
  cursor: pointer;
  background: var(--panel);
  border: 1px solid #444;
  border-radius: 6px;
  color: white;
  padding: 12px 17px;
  font-weight: bold;
}

button:hover,
button.active {
  border-color: var(--orange);
  color: var(--orange);
}

button.primary {
  background: var(--orange);
  color: #111;
  border-color: var(--orange);
}

button:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

.section-title {
  border-bottom: 1px solid #333;
  padding-bottom: 12px;
}

.schedule {
  display: grid;
  gap: 10px;
  margin: 18px 0 40px;
}

.program {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  background: var(--panel);
  padding: 16px;
  border-radius: 7px;
  border-left: 3px solid #444;
  cursor: pointer;
}

.program.current {
  border-left-color: var(--orange);
}

.program small {
  color: var(--muted);
}

.status {
  color: var(--muted);
  font-size: 13px;
  margin: 12px 0;
}

footer {
  text-align: center;
  padding: 28px;
  color: #777;
  border-top: 1px solid #292929;
  font-size: 12px;
}

@media (max-width: 550px) {
  header { padding: 18px 4%; }
  .logo { font-size: 24px; }
  main { margin-top: 25px; }
  .tv { padding: 5px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">NickReboot</div>
  <div class="live">● ON AIR</div>
</header>

<main>
  <h1>You're watching TV.</h1>
  <p class="subtitle">A little blast from the past.</p>

  <div class="tv">
    <div class="screen">
      <video id="player" controls playsinline
        preload="metadata"></video>

      <div class="scanlines"></div>

      <div id="screenMessage">
        <strong>NickReboot</strong>
        <span>YOUR RETRO TV EXPERIENCE</span>
      </div>
    </div>
  </div>

  <div class="info">
    <div>
      <p class="muted">NOW PLAYING</p>
      <p id="nowPlaying">Waiting for broadcast</p>
    </div>

    <div>
      <p class="muted">UP NEXT</p>
      <p id="upNext">Waiting for playlist</p>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="playBtn">▶ Tune In</button>
    <button id="prevBtn">⏮ Previous</button>
    <button id="nextBtn">Next ⏭</button>
    <button id="muteBtn">🔊 Mute</button>
  </div>

  <h2 class="section-title">📺 Programme Guide</h2>
  <p class="status" id="status">Loading programme guide...</p>
  <div class="schedule" id="schedule"></div>
</main>

<footer>
  AN UNOFFICIAL RETRO TV FAN PROJECT · MADE FOR NOSTALGIA
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://mylyzcfxlkszlproidnh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_MshxI2MawNuZ41uRg2zwAw_sB3jdOJN";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// Demonstration playlist used if the database is empty
// or cannot be reached.
let playlist = [
  {
    title: "Retro Test Broadcast",
    description: "Sample video",
    url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
  },
  {
    title: "Colour Test",
    description: "Sample video",
    url: "https://www.w3schools.com/html/mov_bbb.mp4"
  }
];

let current = 0;

const player = document.getElementById("player");
const message = document.getElementById("screenMessage");
const messageText = message.querySelector("span");
const nowPlaying = document.getElementById("nowPlaying");
const upNext = document.getElementById("upNext");
const playBtn = document.getElementById("playBtn");
const muteBtn = document.getElementById("muteBtn");
const schedule = document.getElementById("schedule");
const statusText = document.getElementById("status");

function showMessage(text) {
  messageText.textContent = text;
  message.classList.remove("hidden");
}

function render() {
  if (!playlist.length) {
    nowPlaying.textContent = "No programmes available";
    upNext.textContent = "Waiting for playlist";
    return;
  }

  const item = playlist[current];

  nowPlaying.textContent = item.title;
  upNext.textContent =
    playlist[(current + 1) % playlist.length].title;

  [...schedule.children].forEach((row, i) => {
    row.classList.toggle("current", i === current);
    row.setAttribute(
      "aria-current",
      i === current ? "true" : "false"
    );
  });
}

async function tuneIn(index, autoplay = true) {
  if (!playlist.length) {
    showMessage("NO PROGRAMMES AVAILABLE");
    return;
  }

  if (index === "random") {
    if (playlist.length > 1) {
      let next;

      do {
        next = Math.floor(Math.random() * playlist.length);
      } while (next === current);

      current = next;
    } else {
      current = 0;
    }
  } else {
    current =
      ((index % playlist.length) + playlist.length) %
      playlist.length;
  }

  const item = playlist[current];

  render();
  player.pause();
  player.src = item.url;
  player.load();
  showMessage("TUNING IN...");

  if (!autoplay) return;

  try {
    await player.play();
  } catch (error) {
    console.warn("Playback failed:", error);

    showMessage(
      error.name === "NotAllowedError"
        ? "PRESS PLAY TO START"
        : "VIDEO UNAVAILABLE — CHECK SOURCE"
    );
  }
}

function renderSchedule() {
  schedule.replaceChildren();

  playlist.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "program";
    row.tabIndex = 0;
    row.setAttribute("role", "button");
    row.setAttribute("aria-label", "Play " + item.title);

    const name = document.createElement("strong");
    name.textContent = item.title;

    const detail = document.createElement("small");
    detail.textContent = item.description || "";

    row.append(name, detail);

    row.addEventListener("click", () => tuneIn(i));

    row.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        tuneIn(i);
      }
    });

    schedule.append(row);
  });

  render();
}

// Load programme entries from Supabase.
async function loadPlaylist() {
  statusText.textContent = "Loading shared playlist...";

  try {
    const { data, error } = await supabaseClient
      .from("playlist_items")
      .select("id, title, video_url, description, position")
      .order("position", { ascending: true });

    if (error) throw error;

    if (data && data.length > 0) {
      playlist = data.map(item => ({
        id: item.id,
        title: item.title,
        description: item.description || "",
        url: item.video_url
      }));

      statusText.textContent =
        "Loaded " + playlist.length +
        " programme(s) from the shared database.";
    } else {
      statusText.textContent =
        "Database is connected, but no programmes have been added yet. Showing test videos.";
    }
  } catch (error) {
    console.error("Supabase playlist error:", error.message);

    statusText.textContent =
      "Could not load the database playlist. Showing test videos.";
  }

  current = 0;
  renderSchedule();
}

playBtn.addEventListener("click", async () => {
  if (player.paused) {
    if (!player.currentSrc || player.ended) {
      await tuneIn(current);
    } else {
      try {
        await player.play();
      } catch (error) {
        console.warn("Could not resume playback:", error);
        showMessage("PRESS PLAY TO START");
      }
    }
  } else {
    player.pause();
  }
});

document.getElementById("nextBtn").addEventListener("click", () => {
  tuneIn(current + 1);
});

document.getElementById("prevBtn").addEventListener("click", () => {
  tuneIn(current - 1);
});

muteBtn.addEventListener("click", () => {
  player.muted = !player.muted;
  muteBtn.textContent =
    player.muted ? "🔇 Unmute" : "🔊 Mute";
});

player.addEventListener("play", () => {
  playBtn.textContent = "⏸ Pause";
  message.classList.add("hidden");
});

player.addEventListener("pause", () => {
  playBtn.textContent = "▶ Tune In";
});

player.addEventListener("ended", () => {
  tuneIn("random");
});

player.addEventListener("error", () => {
  const error = player.error;
  console.error("Video error:", {
    code: error ? error.code : 0,
    url: player.currentSrc
  });

  showMessage("VIDEO UNAVAILABLE — CHECK VIDEO SOURCE");
});

loadPlaylist();
</script>

</body>
</html>
