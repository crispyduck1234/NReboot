<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NickReboot — Retro TV</title>

<style>
:root {
  --orange: #ff6500;
  --bg: #101010;
  --panel: #1b1b1b;
  --muted: #aaa;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: white;
  font-family: "Trebuchet MS", Arial, sans-serif;
}

header {
  padding: 22px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #303030;
}

.logo {
  font-weight: 1000;
  font-size: 30px;
  font-style: italic;
  letter-spacing: -2px;
  color: var(--orange);
}

.live {
  color: #ff5555;
  font-size: 12px;
  letter-spacing: 2px;
}

main {
  width: min(1000px, 92%);
  margin: 38px auto;
}

h1 {
  font-size: clamp(26px, 5vw, 44px);
  margin-bottom: 8px;
}

.subtitle {
  color: var(--muted);
  margin-top: 0;
}

.tv {
  padding: 10px;
  border: 2px solid #383838;
  border-radius: 14px;
  background: #222;
  box-shadow: 0 14px 55px #0009;
}

.screen {
  position: relative;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  background: #050505;
  border-radius: 7px;
}

video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.scanlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    #0001 2px,
    #0005 3px,
    transparent 4px
  );
}

#screenMessage {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  padding: 20px;
  pointer-events: none;
}

#screenMessage strong {
  color: var(--orange);
  font-size: clamp(25px, 6vw, 58px);
  font-weight: 1000;
  font-style: italic;
}

#screenMessage span {
  color: #ddd;
  margin-top: 12px;
  font-size: 12px;
  letter-spacing: 3px;
}

#screenMessage.hidden {
  display: none;
}

.info {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: space-between;
  padding: 20px 4px;
}

.info p { margin: 6px 0; }

.muted {
  color: var(--muted);
  font-size: 13px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 10px 0 30px;
}

button {
  cursor: pointer;
  background: var(--panel);
  border: 1px solid #444;
  border-radius: 6px;
  color: white;
  padding: 12px 17px;
  font-weight: bold;
}

button:hover,
button.active {
  border-color: var(--orange);
  color: var(--orange);
}

button.primary {
  background: var(--orange);
  color: #111;
  border-color: var(--orange);
}

button:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

.section-title {
  border-bottom: 1px solid #333;
  padding-bottom: 12px;
}

.schedule {
  display: grid;
  gap: 10px;
  margin: 18px 0 40px;
}

.program {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  background: var(--panel);
  padding: 16px;
  border-radius: 7px;
  border-left: 3px solid #444;
  cursor: pointer;
}

.program.current {
  border-left-color: var(--orange);
}

.program small {
  color: var(--muted);
}

.status {
  color: var(--muted);
  font-size: 13px;
  margin: 12px 0;
}

footer {
  text-align: center;
  padding: 28px;
  color: #777;
  border-top: 1px solid #292929;
  font-size: 12px;
}

@media (max-width: 550px) {
  header { padding: 18px 4%; }
  .logo { font-size: 24px; }
  main { margin-top: 25px; }
  .tv { padding: 5px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">NickReboot</div>
  <div class="live">● ON AIR</div>
</header>

<main>
  <h1>You're watching TV.</h1>
  <p class="subtitle">A little blast from the past.</p>

  <div class="tv">
    <div class="screen">
     <video id="player" playsinline
  preload="metadata"></video>

      <div class="scanlines"></div>

      <div id="screenMessage">
        <strong>NickReboot</strong>
        <span>YOUR RETRO TV EXPERIENCE</span>
      </div>
    </div>
  </div>

  <div class="info">
    <div>
      <p class="muted">NOW PLAYING</p>
      <p id="nowPlaying">Waiting for broadcast</p>
    </div>

    <div>
      <p class="muted">UP NEXT</p>
      <p id="upNext">Waiting for playlist</p>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="playBtn">▶ Tune In</button>
    <button id="prevBtn">⏮ Previous</button>
    <button id="nextBtn">Next ⏭</button>
    <button id="muteBtn">🔊 Mute</button>
  </div>

  <h2 class="section-title">📺 Programme Guide</h2>
  <p class="status" id="status">Loading programme guide...</p>
  <div class="schedule" id="schedule"></div>
</main>

<footer>
  AN UNOFFICIAL RETRO TV FAN PROJECT · MADE FOR NOSTALGIA
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://mylyzcfxlkszlproidnh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_MshxI2MawNuZ41uRg2zwAw_sB3jdOJN";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// Demonstration playlist used if the database is empty
// or cannot be reached.
let playlist = [
  {
    title: "Retro Test Broadcast",
    description: "Sample video",
    url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
  },
  {
    title: "Colour Test",
    description: "Sample video",
    url: "https://www.w3schools.com/html/mov_bbb.mp4"
  }
];

let current = 0;
  function shufflePlaylist(items) {
  const shuffled = [...items];

  // Fisher–Yates shuffle
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  return shuffled;
}

const player = document.getElementById("player");
const message = document.getElementById("screenMessage");
const messageText = message.querySelector("span");
const nowPlaying = document.getElementById("nowPlaying");
const upNext = document.getElementById("upNext");
const playBtn = document.getElementById("playBtn");
const muteBtn = document.getElementById("muteBtn");
const schedule = document.getElementById("schedule");
const statusText = document.getElementById("status");

function showMessage(text) {
  messageText.textContent = text;
  message.classList.remove("hidden");
}

function render() {
  if (!playlist.length) {
    nowPlaying.textContent = "No programmes available";
    upNext.textContent = "Waiting for playlist";
    return;
  }

  const item = playlist[current];

  nowPlaying.textContent = item.title;
  upNext.textContent =
    playlist[(current + 1) % playlist.length].title;

  [...schedule.children].forEach((row, i) => {
    row.classList.toggle("current", i === current);
    row.setAttribute(
      "aria-current",
      i === current ? "true" : "false"
    );
  });
}

async function tuneIn(index, autoplay = true) {
  if (!playlist.length) {
    showMessage("NO PROGRAMMES AVAILABLE");
    return;
  }

  if (index === "random") {
    if (playlist.length > 1) {
      let next;

      do {
        next = Math.floor(Math.random() * playlist.length);
      } while (next === current);

      current = next;
    } else {
      current = 0;
    }
  } else {
    current =
      ((index % playlist.length) + playlist.length) %
      playlist.length;
  }

  const item = playlist[current];

  render();
  player.pause();
  player.src = item.url;
  player.load();
  showMessage("TUNING IN...");

  if (!autoplay) return;

  try {
    await player.play();
  } catch (error) {
    console.warn("Playback failed:", error);

    showMessage(
      error.name === "NotAllowedError"
        ? "PRESS PLAY TO START"
        : "VIDEO UNAVAILABLE — CHECK SOURCE"
    );
  }
}

function renderSchedule() {
  schedule.replaceChildren();

  playlist.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "program";
    row.tabIndex = 0;
    row.setAttribute("role", "button");
    row.setAttribute("aria-label", "Play " + item.title);

    const name = document.createElement("strong");
    name.textContent = item.title;

    const detail = document.createElement("small");
    detail.textContent = item.description || "";

    row.append(name, detail);

   

    schedule.append(row);
  });

  render();
}

async function loadPlaylist() {
  statusText.textContent = "Loading shared playlist...";

  try {
    const { data, error } = await supabaseClient
      .from("playlist_items")
      .select("id, title, video_url, description, position")
      .order("position", { ascending: true });

    if (error) throw error;

    if (data && data.length) {
      playlist = data.map(item => ({
        id: item.id,
        title: item.title,
        description: item.description || "",
        url: item.video_url
      }));

      statusText.textContent =
        "Loaded " + playlist.length + " programme(s).";
    } else {
      playlist = [];
      statusText.textContent = "The shared queue is empty.";
    }
  } catch (error) {
    playlist = [];
    console.error("Playlist error:", error);
    statusText.textContent = "Could not load the shared playlist.";
  }

  current = 0;
  renderSchedule();
}

let broadcastState = null;
let activeBroadcastId = null;
let applyingBroadcast = false;

async function applyBroadcast(state) {
  broadcastState = state;

  if (applyingBroadcast) return;
  applyingBroadcast = true;

  try {
    if (!state || !state.current_item_id) {
      player.pause();
      nowPlaying.textContent = "Waiting for broadcast";
      upNext.textContent = "Waiting for host";
      showMessage("WAITING FOR BROADCAST");
      return;
    }

    const index = playlist.findIndex(
      item => item.id === state.current_item_id
    );

    if (index < 0) {
      statusText.textContent =
        "The current broadcast item isn't in the loaded playlist.";
      return;
    }

    current = index;
    render();

    if (activeBroadcastId !== state.current_item_id) {
      activeBroadcastId = state.current_item_id;
      player.pause();
      player.src = playlist[index].url;
      player.load();
      showMessage("TUNING IN...");

      await new Promise(resolve => {
        if (player.readyState >= 1) {
          resolve();
          return;
        }

        player.addEventListener("loadedmetadata", resolve, {
          once: true
        });
        player.addEventListener("error", resolve, {
          once: true
        });
      });
    }

    if (player.readyState < 1) return;

    const elapsed = state.is_playing
      ? Math.max(
          0,
          (Date.now() - Date.parse(state.started_at)) / 1000
        )
      : Number(state.paused_at_seconds || 0);

    const target = Number.isFinite(player.duration)
      ? Math.min(elapsed, Math.max(0, player.duration - 0.25))
      : elapsed;

    if (Math.abs(player.currentTime - target) > 2) {
      player.currentTime = target;
    }

    if (state.is_playing) {
      try {
        await player.play();
        message.classList.add("hidden");
        statusText.textContent = "Following the live broadcast.";
      } catch (error) {
        showMessage("PRESS TUNE IN TO WATCH");
        statusText.textContent =
          "Your browser needs a click to start playback.";
      }
    } else {
      player.pause();
      showMessage("BROADCAST PAUSED");
      statusText.textContent = "The host has paused the broadcast.";
    }
  } catch (error) {
    console.error("Broadcast sync error:", error);
    statusText.textContent = "Playback synchronisation error.";
  } finally {
    applyingBroadcast = false;
  }
}

async function loadBroadcastState() {
  const { data, error } = await supabaseClient
    .from("broadcast_state")
    .select("*")
    .eq("id", 1)
    .single();

  if (error) {
    console.error("Broadcast state error:", error);
    statusText.textContent = "Could not load broadcast state.";
    return;
  }

  await applyBroadcast(data);
}

supabaseClient
  .channel("nreboot-live-broadcast")
  .on(
    "postgres_changes",
    {
      event: "UPDATE",
      schema: "public",
      table: "broadcast_state",
      filter: "id=eq.1"
    },
    payload => {
      applyBroadcast(payload.new);
    }
  )
  .subscribe(status => {
    if (status === "SUBSCRIBED") {
      loadBroadcastState();
    } else if (status === "CHANNEL_ERROR") {
      statusText.textContent =
        "Live connection failed. Refresh the page to retry.";
    }
  });

// Periodically correct playback drift.
setInterval(() => {
  if (broadcastState) applyBroadcast(broadcastState);
}, 5000);

// Viewer controls never change the shared broadcast.
playBtn.addEventListener("click", async () => {
  if (!broadcastState || !broadcastState.is_playing) {
    showMessage("WAITING FOR HOST");
    return;
  }

  await applyBroadcast(broadcastState);
});

document.getElementById("nextBtn").addEventListener("click", () => {
  statusText.textContent = "The host controls the broadcast.";
});

document.getElementById("prevBtn").addEventListener("click", () => {
  statusText.textContent = "The host controls the broadcast.";
});

muteBtn.addEventListener("click", () => {
  player.muted = !player.muted;
  muteBtn.textContent =
    player.muted ? "🔇 Unmute" : "🔊 Mute";
});

player.addEventListener("play", () => {
  playBtn.textContent = "▶ Tune In";
  message.classList.add("hidden");
});

player.addEventListener("pause", () => {
  playBtn.textContent = "▶ Tune In";
});

player.addEventListener("ended", () => {
  showMessage("WAITING FOR NEXT PROGRAMME");
});

player.addEventListener("error", () => {
  console.error("Video error:", player.error, player.currentSrc);
  showMessage("VIDEO UNAVAILABLE — CHECK VIDEO SOURCE");
});

loadPlaylist().then(() => loadBroadcastState());
  player.addEventListener("ended", async () => {
  if (!playlist.length) return;

  // Advance to the next programme, looping at the end.
  const next = (current + 1) % playlist.length;

  await playProgram(next, true);
});
</script>

</body>
</html>
